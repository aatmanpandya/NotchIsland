# Generates NotchIsland.xcodeproj: run `xcodegen generate`. The .xcodeproj is not committed.
name: NotchIsland
options:
  bundleIdPrefix: com.aatmanpandya
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.10.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    # The copy-extension script writes into the app bundle.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Local builds sign to run locally; release builds set the team and identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
  configs:
    # Release builds go to the App Store or notarization, which reject the debugging entitlement.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targetTemplates:
  IslandApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/NotchIsland
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: NotchIsland
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Copy browser extension
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete "$SRCROOT/Extensions/Chrome/" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ChromeExtension/"
    scheme: {}

targets:
  # App Store edition: sandboxed, public APIs only.
  NotchIsland:
    templates: [IslandApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aatmanpandya.NotchIsland
        CODE_SIGN_ENTITLEMENTS: Resources/AppStore.entitlements

  # Direct-download edition: notarized, adds the system-wide Now Playing helper.
  NotchIsland Direct:
    templates: [IslandApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aatmanpandya.NotchIsland.Direct
        CODE_SIGN_ENTITLEMENTS: Resources/Direct.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_DISTRIBUTION
    dependencies:
      # Copied into Resources but not linked: the app never loads it itself; perl does.
      - target: NowPlayingHelper
        link: false
        embed: true
        copy:
          destination: resources

  # Loaded into /usr/bin/perl by the direct edition (see SystemNowPlayingSource.swift).
  NowPlayingHelper:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Helpers/NowPlayingHelper
    settings:
      base:
        PRODUCT_NAME: NowPlayingHelper
        EXECUTABLE_PREFIX: ""
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: -framework Foundation
